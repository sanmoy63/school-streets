[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routes-ssr"
version = "0.1.0"
description = "School-street readiness baseline for the ROUTES pilot cities"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Sanmoy Mukherjee" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# `pythonpath` removes the need for the sys.path.insert dance the scripts use;
# tests import `routes_ssr` as a normal package.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # Shapely/GeoPandas emit these on degenerate synthetic geometries, which the
    # tests construct deliberately.
    "ignore::RuntimeWarning",
]
