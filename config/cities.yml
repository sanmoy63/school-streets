# Study cities and candidates for extension.
#
# `place` strings are resolved through OSM Nominatim. `epsg` is the projected CRS
# used for all metric operations (buffers, lengths, densities) in that city --
# never compute distances in EPSG:4326.
#
# Why two cities, and why these two
# ---------------------------------
# The pair is chosen for contrast on the one variable that turned out to matter
# most, and held roughly constant on the others.
#
# *Topography.* Rotterdam is flat: -18 m to +33 m across the whole city, mean
# pedestrian gradient 0.044. Genova is not: sea level to over 400 m inside the
# built-up area, mean gradient 0.103, with 290 km of stairways -- 4.7% of its
# walking network against Rotterdam's 0.9%.
#
# That contrast is the point. A walkability measure built and tested only on
# flat ground can look perfectly sound and still be wrong everywhere else, and
# this pair demonstrated exactly that: routing on flat distance put the two
# cities within 0.027 of each other, while slope-adjusted routing separates them
# by 0.157 (method note 4e).
#
# *Held roughly constant.* Both are EU members with comparable data-protection
# and open-data regimes, both are port cities of similar order of population, and
# both have mature OSM communities. Differences that remain -- and they are
# large -- are therefore attributable to the cities rather than to their national
# statistical systems.
#
# `observers` are candidates for extending the method, not yet run. The aim is to
# test whether the indicator set generalises across more European contexts, and
# on that evidence to converge on a measure that can be applied as a standard
# rather than rebuilt per study.

pilots:
  rotterdam:
    place: "Rotterdam, Netherlands"
    country: NL
    epsg: 28992          # Amersfoort / RD New
    status: pilot
    notes: >
      The flat case. -18 m to +33 m across the city; mean pedestrian gradient
      0.044. Also the richer of the two open-data environments, so it doubles as
      the reference implementation.

  genova:
    place: "Genoa, Italy"
    country: IT
    epsg: 32632          # WGS 84 / UTM zone 32N
    status: pilot
    notes: >
      The steep case. Sea level to >400 m within the city; mean gradient 0.103;
      290 km of stairways and funiculars as everyday pedestrian links. It was
      included to test whether a flat constant-speed walkshed survives real
      relief. It did not: see method note 4e. UTM 32N is used rather than
      RDN2008 / UTM 32N (EPSG:6707) because the latter declares a north-east
      axis order, which invites axis-swap bugs for no benefit at this scale.

# Candidates for extending the study. Not run by default.
#
# Antwerp and Krakow come first: Antwerp is the closest available control on
# Rotterdam -- flat, comparable density, different national data regime and a
# separate OSM community -- and Krakow adds a moderate-relief case between the
# two extremes. The rest pair a second city with each national regime already
# represented, which separates city-level variation from national data
# availability.
observers:
  antwerp:
    place: "Antwerpen, Belgium"
    country: BE
    epsg: 31370          # BD72 / Belgian Lambert 72
    status: observer
    notes: >
      Flat, comparable density to Rotterdam, different national data regime and
      OSM community. The closest available control on the Rotterdam case.

  krakow:
    place: "Krakow, Poland"
    country: PL
    epsg: 2180           # ETRF2000-PL / CS92
    status: observer
    notes: >
      Moderate relief (~200-250 m) and a dense historic core: an intermediate
      case between Rotterdam's flatness and Genova's slopes.

  utrecht:
    place: "Utrecht, Netherlands"
    country: NL
    epsg: 28992
    status: observer
  ghent:
    place: "Ghent, Belgium"
    country: BE
    epsg: 31370
    status: observer
  wroclaw:
    place: "Wroclaw, Poland"
    country: PL
    epsg: 2180
    status: observer
  turin:
    place: "Turin, Italy"
    country: IT
    epsg: 32632
    status: observer

# ---------------------------------------------------------------------------
# Analysis parameters. These are the knobs that define the indicator set; they
# are kept here rather than in code so that a reviewer can see every threshold
# in one place.
# ---------------------------------------------------------------------------

walkshed:
  # Network-distance thresholds, in minutes, from each school entrance.
  minutes: [5, 10, 15]
  # Walking speed for a child accompanied by an adult. Deliberately below the
  # 4.8 km/h adult default used in most walkability work: the relevant traveller
  # here is a 6-12 year old, and using an adult speed inflates every catchment.
  #
  # This is the speed on LEVEL ground. With --slope it anchors Tobler's hiking
  # function, which sets a per-edge speed from gradient (see terrain.py); without
  # it, the figure is applied flat to every segment.
  #
  # Running flat is only defensible where relief is slight. In Genova it moved
  # reach_ratio from 0.481 to 0.305, and moved the gap against Rotterdam by a
  # factor of 5.8, so flat routing is retained for comparison rather than as a
  # recommended default.
  walk_speed_kmh: 3.6

schools:
  # OSM tags used to identify the school population. isced:level filtering is
  # applied afterwards where the tag exists, but coverage is poor -- only 97 of
  # 289 Rotterdam features carried it -- so name matching does most of the work.
  tags:
    amenity: ["school", "kindergarten"]

  # Primary/kindergarten only: this analysis is about children walking to
  # school, not teenagers commuting across a city or students at a tertiary
  # institution, whose catchments are an order of magnitude wider.
  #
  # The first version of this list held four patterns and let through Mavo
  # Centraal (Dutch secondary), Luzac Rotterdam (exam college) and the Piet
  # Zwart Institute (tertiary art academy). Secondary and tertiary institutions
  # must be excluded because their catchment is not a walking catchment; leaving
  # them in biases every neighbourhood-scale statistic that follows.
  #
  # Grouped by language so the list stays auditable as cities are added.
  exclude_name_patterns:
    # --- generic / international ---
    - "(?i)universit"
    - "(?i)\\bcollege\\b"
    - "(?i)academ(y|ie|ia)"
    - "(?i)\\binstitut(e|te)?\\b"
    - "(?i)campus"
    - "(?i)politech|politecnic"
    # --- Dutch / Flemish (Rotterdam, Antwerp) ---
    - "(?i)hogeschool"
    - "(?i)\\b(mavo|havo|vwo|vmbo|mbo|roc|aso|tso|kso)\\b"
    - "(?i)lyceum"
    - "(?i)gymnasium"
    - "(?i)scholengemeenschap"
    - "(?i)voortgezet"
    - "(?i)volwassen"
    - "(?i)praktijkschool"
    - "(?i)middelbare"
    - "(?i)atheneum"
    - "(?i)humaniora"
    - "(?i)secundair"
    # --- Polish (Krakow) ---
    # `ponadpodstawow` is required rather than `podstawow`, which would also
    # match "szkola podstawowa" -- the primary schools we are trying to keep.
    - "(?i)liceum"
    - "(?i)technikum"
    - "(?i)gimnazjum"
    - "(?i)ponadpodstawow"
    - "(?i)uniwersytet"
    - "(?i)zawodow"          # vocational
    # --- Italian (Genova) ---
    # NOT a bare "istituto": an "Istituto Comprensivo" is the standard Italian
    # unit that *contains* the primary school, so excluding it would drop most
    # of the population we want. Only the secondary/tertiary forms are listed.
    - "(?i)liceo"
    - "(?i)istituto tecnico"
    - "(?i)istituto professionale"
    - "(?i)istituto superiore"
    - "(?i)scuola secondaria"
    - "(?i)scuola media"
    # Adult and staff education, found leaking through in the Genova run.
    # CPIA = Centro Provinciale per l'Istruzione degli Adulti; "UO Formazione"
    # is a health-authority staff training unit; "aule didattiche" are teaching
    # rooms rather than a school.
    #
    # Note what is NOT excluded: a bare "centro". It would have caught
    # "Centro Infanzia Porto Antico" (a real kindergarten) and "Istituto
    # Comprensivo Centro Storico" (a real primary, where "centro" is the
    # district name) -- the same trap as a bare "istituto", one word along.
    # No word boundary: in a YAML double-quoted scalar "\b" is a backspace, not
    # a regex escape, so it would have to be written "\\bCPIA\\b". "CPIA" is
    # distinctive enough not to need one.
    - "(?i)CPIA"
    - "(?i)formazione"
    - "(?i)aule didattiche"
    # Italian secondary institutes come in many named forms. These were found by
    # inspecting outlier lists across two Genova runs; the set is demonstrably
    # not closed -- see the method note on the irreducible error rate of
    # name-based filtering.
    - "(?i)istituto nautico"
    - "(?i)istituto magistrale"
    - "(?i)istituto d.arte"
    - "(?i)istituto alberghiero"

  # An unnamed feature cannot be name-filtered. In Rotterdam 34 (12%) of kept
  # features are unnamed. Dropping them would discard real primary schools;
  # keeping them silently admits whatever they are. They are kept and flagged so
  # that the count can be reported with and without them.
  flag_unnamed: true

network:
  # Pedestrian network. 'walk' in OSMnx already drops motorways and respects
  # foot=no, but we keep service roads: school access frequently runs over them.
  type: "walk"
  # Speed limits above this are treated as hostile to child pedestrians when no
  # separated footway is present.
  hostile_speed_kmh: 50

segment_index:
  # Weights for the composite street-segment index. Equal weights within the
  # three domains, with domains weighted by their standing in the school-street
  # literature. Sensitivity to these weights is reported in the method note --
  # a composite whose ranking is not robust to its own weights is not evidence.
  domain_weights:
    traffic_safety: 0.40
    walking_infrastructure: 0.35
    environment: 0.25
