# Pilot cities + observer cities.
#
# `place` strings are resolved through OSM Nominatim. `epsg` is the projected CRS
# used for all metric operations (buffers, lengths, densities) in that city --
# never compute distances in EPSG:4326.
#
# `status` distinguishes the four pilots from observer cities, which are carried
# through the pipeline as an out-of-sample check on whether the indicators
# transfer within a data regime rather than across one.
#
# Why these four
# --------------
# They vary along two axes the indicator set is sensitive to.
#
# *Data regime.* All four are EU members, so the spread is narrower than it
# would be with a non-EU case. That is deliberate: if a harmonised indicator set
# fails across four comparably-resourced European cities, it fails everywhere,
# and the failure cannot be waved away as a poor-country problem.
#
# *Topography.* Rotterdam, Antwerp and Krakow are flat to gently undulating.
# Genova is not: it climbs from sea level to over 400 m inside the built-up
# area, with stairways, funiculars and public lifts as everyday pedestrian
# infrastructure. This matters because the walkshed model currently assumes a
# constant walking speed on a flat network (see `walkshed.walk_speed_kmh`).
# Genova is the case that tests that assumption, and it is included precisely
# because it is expected to break it.

pilots:
  rotterdam:
    place: "Rotterdam, Netherlands"
    country: NL
    epsg: 28992          # Amersfoort / RD New
    status: pilot
    notes: >
      Richest open-data environment of the four and essentially flat; used as
      the reference implementation.

  antwerp:
    place: "Antwerpen, Belgium"
    country: BE
    epsg: 31370          # BD72 / Belgian Lambert 72
    status: pilot
    notes: >
      Flat, comparable density to Rotterdam, but a different national data
      regime and a separate OSM mapping community. The closest thing to a
      like-for-like control on Rotterdam.

  krakow:
    place: "Krakow, Poland"
    country: PL
    epsg: 2180           # ETRF2000-PL / CS92
    status: pilot
    notes: >
      Gently undulating (~200-250 m), dense historic core with a very different
      street morphology. Moderate national open-data provision.

  genova:
    place: "Genoa, Italy"
    country: IT
    epsg: 32632          # WGS 84 / UTM zone 32N
    status: pilot
    notes: >
      Steep: sea level to >400 m within the city, with stairways and funiculars
      as real pedestrian links. Expected to break the flat constant-speed
      walkshed assumption, which is why it is here. UTM 32N is used rather than
      RDN2008 / UTM 32N (EPSG:6707) because the latter declares a north-east
      axis order, which invites axis-swap bugs for no benefit at this scale.

# Observer cities: a second city in each pilot's country. They test whether an
# indicator that works in one city transfers to another *within the same data
# regime*, which isolates city-level variation from national-level data
# availability. Not run by default.
observers:
  utrecht:
    place: "Utrecht, Netherlands"
    country: NL
    epsg: 28992
    status: observer
  ghent:
    place: "Ghent, Belgium"
    country: BE
    epsg: 31370
    status: observer
  wroclaw:
    place: "Wroclaw, Poland"
    country: PL
    epsg: 2180
    status: observer
  turin:
    place: "Turin, Italy"
    country: IT
    epsg: 32632
    status: observer

# ---------------------------------------------------------------------------
# Analysis parameters. These are the knobs that define the indicator set; they
# are kept here rather than in code so that a reviewer can see every threshold
# in one place.
# ---------------------------------------------------------------------------

walkshed:
  # Network-distance thresholds, in minutes, from each school entrance.
  minutes: [5, 10, 15]
  # Walking speed for a child accompanied by an adult. Deliberately below the
  # 4.8 km/h adult default used in most walkability work: the relevant traveller
  # here is a 6-12 year old, and using an adult speed inflates every catchment.
  #
  # NOTE: this is a single flat-terrain figure applied to every segment. It is
  # defensible in Rotterdam, Antwerp and Krakow. It is not obviously defensible
  # in Genova, where gradient dominates walking effort and a slope-adjusted
  # function (Tobler) would be the standard correction. Treated as an open
  # question rather than silently assumed away.
  walk_speed_kmh: 3.6

schools:
  # OSM tags used to identify the school population. isced:level filtering is
  # applied afterwards where the tag exists, but coverage is poor -- only 97 of
  # 289 Rotterdam features carried it -- so name matching does most of the work.
  tags:
    amenity: ["school", "kindergarten"]

  # Primary/kindergarten only: this analysis is about children walking to
  # school, not teenagers commuting across a city or students at a tertiary
  # institution, whose catchments are an order of magnitude wider.
  #
  # The first version of this list held four patterns and let through Mavo
  # Centraal (Dutch secondary), Luzac Rotterdam (exam college) and the Piet
  # Zwart Institute (tertiary art academy). Secondary and tertiary institutions
  # must be excluded because their catchment is not a walking catchment; leaving
  # them in biases every neighbourhood-scale statistic that follows.
  #
  # Grouped by language so the list stays auditable as cities are added.
  exclude_name_patterns:
    # --- generic / international ---
    - "(?i)universit"
    - "(?i)\\bcollege\\b"
    - "(?i)academ(y|ie|ia)"
    - "(?i)\\binstitut(e|te)?\\b"
    - "(?i)campus"
    - "(?i)politech|politecnic"
    # --- Dutch / Flemish (Rotterdam, Antwerp) ---
    - "(?i)hogeschool"
    - "(?i)\\b(mavo|havo|vwo|vmbo|mbo|roc|aso|tso|kso)\\b"
    - "(?i)lyceum"
    - "(?i)gymnasium"
    - "(?i)scholengemeenschap"
    - "(?i)voortgezet"
    - "(?i)volwassen"
    - "(?i)praktijkschool"
    - "(?i)middelbare"
    - "(?i)atheneum"
    - "(?i)humaniora"
    - "(?i)secundair"
    # --- Polish (Krakow) ---
    # `ponadpodstawow` is required rather than `podstawow`, which would also
    # match "szkola podstawowa" -- the primary schools we are trying to keep.
    - "(?i)liceum"
    - "(?i)technikum"
    - "(?i)gimnazjum"
    - "(?i)ponadpodstawow"
    - "(?i)uniwersytet"
    - "(?i)zawodow"          # vocational
    # --- Italian (Genova) ---
    # NOT a bare "istituto": an "Istituto Comprensivo" is the standard Italian
    # unit that *contains* the primary school, so excluding it would drop most
    # of the population we want. Only the secondary/tertiary forms are listed.
    - "(?i)liceo"
    - "(?i)istituto tecnico"
    - "(?i)istituto professionale"
    - "(?i)istituto superiore"
    - "(?i)scuola secondaria"
    - "(?i)scuola media"

  # An unnamed feature cannot be name-filtered. In Rotterdam 34 (12%) of kept
  # features are unnamed. Dropping them would discard real primary schools;
  # keeping them silently admits whatever they are. They are kept and flagged so
  # that the count can be reported with and without them.
  flag_unnamed: true

network:
  # Pedestrian network. 'walk' in OSMnx already drops motorways and respects
  # foot=no, but we keep service roads: school access frequently runs over them.
  type: "walk"
  # Speed limits above this are treated as hostile to child pedestrians when no
  # separated footway is present.
  hostile_speed_kmh: 50

segment_index:
  # Weights for the composite street-segment index. Equal weights within the
  # three domains, with domains weighted by their standing in the school-street
  # literature. Sensitivity to these weights is reported in the method note --
  # a composite whose ranking is not robust to its own weights is not evidence.
  domain_weights:
    traffic_safety: 0.40
    walking_infrastructure: 0.35
    environment: 0.25
