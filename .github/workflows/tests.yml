name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # The suite is entirely offline: every fixture is synthetic, and nothing
      # touches Overpass or the data/ tree. That is deliberate -- a test suite
      # that needs a live API is a test suite that fails for reasons unrelated
      # to the code.
      - name: Run tests
        run: pytest -q
